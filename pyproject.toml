[project]
name = "end-to-end-ml-pipeline"
version = "0.1.0"
description = "End-to-end California Housing ML pipeline with MLflow tracking, FastAPI serving, Streamlit UI, and automated PDF reporting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.14.2",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mlflow>=3.15.1",
    "pandas>=2.3.3",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "reportlab>=5.0.0",
    "requests>=2.32.0",
    "ruff>=0.16.3",
    "scikit-learn>=1.9.0",
    "streamlit>=1.61.1",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "pytest-anyio>=0.0.0",
    "pytest-cov>=7.1.0",
]

[tool.mypy]
ignore_missing_imports = true
